<title>Team Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: quiet sidebar of subjects; main column = title, one-line summary, add bar, plain rows. One accent colour; subject colours only as small dots. Details open in a side drawer. */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --hover: #f2f2f0; --ink: #1d1e22; --muted: #74767d; --faint: #a3a5ab; --line: #ebebe8;
  --accent: #2f5bea; --accent-ink: #ffffff; --late: #d1403a; --ok: #2e8b57; --scrim: rgba(20, 20, 24, .32); --shadow: rgba(20, 20, 24, .12);
  --s0: #2f5bea; --s1: #d1403a; --s2: #2e8b57; --s3: #c27a12; --s4: #8a4fc4; --s5: #148a99; --s6: #c7487f; --s7: #6b6e78;
  --f: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141416; --surface: #1b1b1e; --hover: #232327; --ink: #ececee; --muted: #9a9ca3; --faint: #6c6e75; --line: #2a2a2f;
  --accent: #7f9cff; --accent-ink: #141416; --late: #ff7b72; --ok: #5cc98e; --scrim: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
  --s0: #7f9cff; --s1: #ff7b72; --s2: #5cc98e; --s3: #f0a640; --s4: #c48bf0; --s5: #4fc7d6; --s6: #f07db3; --s7: #a3a6b0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1b1b1e; --hover: #232327; --ink: #ececee; --muted: #9a9ca3; --faint: #6c6e75; --line: #2a2a2f;
  --accent: #7f9cff; --accent-ink: #141416; --late: #ff7b72; --ok: #5cc98e; --scrim: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
  --s0: #7f9cff; --s1: #ff7b72; --s2: #5cc98e; --s3: #f0a640; --s4: #c48bf0; --s5: #4fc7d6; --s6: #f07db3; --s7: #a3a6b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wrap { max-width: 860px; margin: 0 auto; padding-inline: 24px; padding-block: 20px 64px; }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.brand { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.top .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 8px; background: var(--hover); color: var(--muted); width: min(240px, 100%); }
.search input { border: 0; background: none; padding: 7px 0; min-width: 0; flex: 1; outline: none; font-size: 14px; color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.online { display: flex; align-items: center; }
.ppl { display: inline-flex; align-items: center; }
.ppl img { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -6px; background: var(--hover); }
.ppl img:first-child { margin-left: 0; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); padding: 0; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.me img { width: 28px; height: 28px; border-radius: 50%; display: block; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); }
.spick { flex: none; }
.pick-btn { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; padding: 2px 8px; margin-left: -8px; border-radius: 8px; text-align: left; }
.pick-btn:hover, .pick-btn[aria-expanded="true"] { background: var(--hover); }
.title-row .pick-btn h2 { flex: none; max-width: calc(100vw - 130px); overflow-wrap: normal; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn svg { color: var(--muted); width: 20px; height: 20px; }
.tdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.menu.sdrop { left: -8px; right: auto; min-width: 280px; max-width: min(360px, calc(100vw - 32px)); max-height: 65vh; overflow-y: auto; }
.menu.sdrop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.sopt { display: flex !important; align-items: center; gap: 10px; width: 100%; }
.sopt .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.sopt .dot.none { background: none; width: 8px; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.sopt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sopt .code { font-size: 12px; color: var(--faint); }
.sopt .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-width: 14px; text-align: right; }
.sopt[aria-checked="true"] { background: var(--hover); font-weight: 600; }
.sopt.muted { color: var(--muted); }
.sopt.arch { opacity: .6; }

/* Sidebar */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 2px; }
.tab { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; color: var(--muted); font-size: 14px; }
.tab:hover { background: var(--hover); color: var(--ink); }
.tab[aria-current="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
.tab .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; font-weight: 500; }
.tab.arch { opacity: .6; }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 8px 10px; }
.linkbtn { border: 0; background: none; padding: 6px 10px; color: var(--faint); font-size: 13.5px; text-align: left; border-radius: 7px; }
.linkbtn:hover { color: var(--ink); background: var(--hover); }
.addsub { display: grid; gap: 6px; padding: 6px 4px; }
.field { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); min-width: 0; font-size: 14px; }
.field::placeholder { color: var(--faint); }
.field:focus { outline: none; border-color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.text { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.text:hover { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--late); }
.btn.danger.solid { background: var(--late); color: var(--surface); border-color: var(--late); }
.btn:disabled { opacity: .5; cursor: default; }

/* Main */
.main { min-width: 0; display: grid; gap: 18px; }
.mhead { display: grid; gap: 6px; }
.title-row { display: flex; align-items: center; gap: 8px; }
.title-row h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.summary { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 0; }
.summary > span:not(:last-child)::after { content: "·"; margin: 0 8px; color: var(--faint); }
.summary .late { color: var(--late); }
.summary button { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 500; }
.summary button:hover { text-decoration: underline; }
.summary b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 190px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 10px 30px var(--shadow); z-index: 10; display: grid; }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 6px; text-align: left; font-size: 14px; }
.menu button:hover { background: var(--hover); }

.quick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.quick:focus-within { border-color: var(--accent); }
.quick > svg { color: var(--faint); }
.quick input { border: 0; background: none; padding: 8px 0; min-width: 0; outline: none; }
.quick input::placeholder { color: var(--faint); }
.qprev { grid-column: 1 / -1; display: grid; gap: 6px; padding: 2px 8px 8px 0; min-width: 0; }
.qprev:empty { display: none; }
.qgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.qgroup .sp { flex: 1; }
.qchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 3px 11px; font-size: 13px; white-space: nowrap; }
.qchip:hover { color: var(--ink); border-color: var(--faint); }
.qchip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.qchip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.qdate { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 2px 8px; font-size: 13px; }
.qlink { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 3px 4px; white-space: nowrap; }
.qlink:hover { text-decoration: underline; }
.qhint { font-size: 12px; color: var(--faint); white-space: nowrap; }
.col-add { border: 0; background: none; padding: 9px 8px; font-size: 14px; outline: none; width: 100%; border-radius: 7px; }
.col-add::placeholder { color: var(--faint); }
.col-add:hover { background: var(--hover); }
.col-add:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--accent); }
.day { cursor: pointer; }
.paste-prev { display: grid; gap: 2px; max-height: 200px; overflow-y: auto; }
.paste-prev:empty { display: none; }
.pp { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
.pp .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tpl { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; }
.tpl:hover { border-color: var(--accent); }
.tpl b { font-weight: 600; font-size: 14.5px; }
.tpl span { font-size: 12.5px; color: var(--muted); }
.fab { display: none; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; border-bottom: 1px solid var(--line); }
.tabs-u { display: flex; gap: 16px; overflow-x: auto; }
.tabs-u button { border: 0; background: none; padding: 6px 0 9px; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs-u button:hover { color: var(--ink); }
.tabs-u button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.bar .sp { flex: 1; }
.filter { border: 0; background: none; color: var(--muted); font-size: 13.5px; padding: 6px 0 9px; }
.filter:hover { color: var(--ink); }
select.filter { padding-right: 4px; }

/* Rows */
.rows { display: grid; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 8px; border-bottom: 1px solid var(--line); border-radius: 0; }
.row:hover { background: var(--hover); }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.6px solid var(--faint); background: none; padding: 0; margin-top: 1px; display: grid; place-items: center; }
.check:hover:not(:disabled) { border-color: var(--ok); }
.check[data-s="doing"] { border-color: var(--accent); background: conic-gradient(var(--accent) 0 50%, transparent 50% 100%); }
.check[data-s="done"] { border-color: var(--ok); background: var(--ok); }
.check[data-s="done"]::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.check:disabled { cursor: default; }
.row .main-c { min-width: 0; display: grid; gap: 2px; }
.row .t { border: 0; background: none; padding: 0; text-align: left; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.row.done .t { color: var(--faint); text-decoration: line-through; }
.row .m { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; font-size: 12.5px; color: var(--muted); }
.row .m > span { display: inline-flex; align-items: center; gap: 5px; }
.row .m > span:not(:last-child)::after { content: "·"; margin: 0 7px; color: var(--faint); }
.row .m i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.row .m .ppl img { width: 18px; height: 18px; border-color: var(--bg); }
.row:hover .m .ppl img { border-color: var(--hover); }
.row .r { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; display: flex; align-items: center; gap: 8px; }
.row .r.late { color: var(--late); }
.row .r.soon { color: var(--ink); font-weight: 600; }
.here img { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ok); }
.row[draggable="true"] { cursor: grab; }
.row.dragging { opacity: .4; }

/* Board */
.board { display: grid; grid-template-columns: repeat(3, minmax(230px, 1fr)); gap: 20px; overflow-x: auto; }
.col { display: grid; align-content: start; min-height: 140px; border-radius: 10px; }
.col.over { background: var(--hover); }
.col h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; padding: 0 8px; }
.col h4 span { color: var(--faint); font-weight: 500; }
.col .row { grid-template-columns: 22px minmax(0, 1fr); }
.col .row .r { grid-column: 2; padding: 0; }

/* Calendar */
.cal-h { display: flex; align-items: center; gap: 4px; }
.cal-h h3 { margin: 0 8px 0 0; font-size: 16px; font-weight: 600; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.cal-g .dow { font-size: 12px; color: var(--faint); padding: 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.day { min-height: 92px; padding: 4px; display: grid; align-content: start; gap: 2px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.day.out .num { color: var(--faint); opacity: .6; }
.day.sel { background: var(--hover); }
.day .num { font-size: 12px; color: var(--muted); border: 0; background: none; padding: 2px 4px; justify-self: start; border-radius: 5px; font-variant-numeric: tabular-nums; }
.day.today .num { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.ev { display: flex; align-items: center; gap: 5px; width: 100%; border: 0; background: none; border-radius: 4px; padding: 1px 4px; font-size: 12px; text-align: left; min-width: 0; }
.ev i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
.ev span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.done span { text-decoration: line-through; color: var(--faint); }
.ev:hover { background: var(--hover); }
.ev-more { font-size: 11.5px; color: var(--faint); border: 0; background: none; text-align: left; padding: 0 4px; }

.empty { padding: 48px 12px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty h3 { margin: 0; color: var(--ink); font-size: 17px; font-weight: 600; }
.empty p { margin: 0; max-width: 44ch; font-size: 14px; }
.hint { font-size: 13px; color: var(--faint); }

/* Drawer + modal */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; justify-content: flex-end; }
.overlay.center { justify-content: center; align-items: center; padding: 16px; overflow-y: auto; }
.drawer { width: min(600px, 100%); height: 100%; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: -12px 0 40px var(--shadow); }
.drawer-h { padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drawer-b { overflow-y: auto; padding: 4px 28px 24px; display: grid; gap: 22px; align-content: start; }
.drawer-f { padding: 12px 28px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drawer-f .sp { flex: 1; }
.t-in { border: 0; background: none; font-size: 24px; font-weight: 700; letter-spacing: -.01em; padding: 0; width: 100%; outline: none; }
.t-in::placeholder { color: var(--faint); }
.props { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 2px 12px; align-items: center; font-size: 14px; }
.props > .k { color: var(--muted); padding: 6px 0; }
.props > .v { min-width: 0; }
.ghost-in { border: 1px solid transparent; background: none; border-radius: 6px; padding: 5px 8px; margin-left: -8px; max-width: 100%; }
.ghost-in:hover:not(:disabled) { background: var(--hover); }
.ghost-in:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.ghost-in:disabled { opacity: 1; }
.seg { display: inline-flex; gap: 2px; margin-left: -8px; }
.seg button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 14px; }
.seg button:hover:not(:disabled) { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
.sec { display: grid; gap: 8px; }
.sec-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sec-h .sp { flex: 1; }
.sec-h .lnk { border: 0; background: none; padding: 2px 6px; border-radius: 5px; color: var(--muted); font-size: 13px; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; }
.sec-h .lnk:hover { color: var(--ink); background: var(--hover); }
.sec-h .lnk[aria-pressed="true"] { color: var(--ink); }
.people { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 2px; border-radius: 99px; background: var(--hover); font-size: 13px; }
.chip img { width: 20px; height: 20px; border-radius: 50%; }
.chip button { border: 0; background: none; padding: 0 5px; color: var(--muted); font-size: 15px; line-height: 1; }
.picker { position: relative; min-width: 140px; flex: 1; }
.picker input { width: 100%; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; z-index: 2; box-shadow: 0 10px 30px var(--shadow); display: grid; }
.results button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 8px; border-radius: 6px; text-align: left; font-size: 14px; }
.results button:hover { background: var(--hover); }
.results img { width: 20px; height: 20px; border-radius: 50%; }

.cl-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto 26px; gap: 8px; align-items: center; }
.cl-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ok); margin: 0; }
.cl-row .txt { border: 0; background: none; padding: 4px 0; min-width: 0; outline: none; font-size: 14px; }
.cl-row .txt.done { color: var(--faint); text-decoration: line-through; }
.cl-row select, .cl-row input[type="date"] { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 2px 4px; border-radius: 5px; max-width: 130px; }
.cl-row select:hover, .cl-row input[type="date"]:hover { background: var(--hover); }
.cl-add { border: 0; background: none; padding: 4px 0 4px 28px; outline: none; font-size: 14px; width: 100%; }
.cl-add::placeholder { color: var(--faint); }
.x { border: 0; background: none; color: var(--faint); font-size: 17px; line-height: 1; padding: 3px; border-radius: 5px; }
.x:hover { color: var(--late); background: var(--hover); }
.cl-row .x { visibility: hidden; }
.cl-row:hover .x, .cl-row:focus-within .x { visibility: visible; }

.notes { width: 100%; min-height: 140px; border: 0; background: none; padding: 0; resize: vertical; outline: none; font-size: 14.5px; line-height: 1.6; }

    const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
    for (const raw of String(src || '').split('\n')) {
      const line = raw.replace(/\s+$/, '');
      let m;
      if (!line.trim()) { flushP(); flushL(); continue; }
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushP(); flushL(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
      flushL(); para.push(line);
    }
    flushP(); flushL();
    return out.join('');
  }

  // ---------- quick add ----------
  const DAYS = { sun: 0, sunday: 0, ahad: 0, mon: 1, monday: 1, isnin: 1, tue: 2, tues: 2, tuesday: 2, selasa: 2, wed: 3, wednesday: 3, rabu: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, khamis: 4, fri: 5, friday: 5, jumaat: 5, sat: 6, saturday: 6, sabtu: 6 };
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function parseQuick(text) {
    let t = ' ' + text + ' ';
    const out = { kind: 'task', subjectId: null, due: null, me: false, title: '' };
    const take = re => { const m = t.match(re); if (m) t = t.replace(re, ' '); return m; };
    const keys = [];
    for (const s of activeSubjects()) { if (s.code) keys.push([s.code, s.id]); if (s.name) keys.push([s.name, s.id]); }
    keys.sort((a, b) => b[0].length - a[0].length);
    for (const [k, id] of keys) { if (take(new RegExp('\\s' + escRe(k) + '(?=\\s)', 'i'))) { out.subjectId = id; break; } }
    if (take(/\s@me(?=\s)/i)) out.me = true;
    const today = startOfToday();
    const addDays = n => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };
    let m;
    if (take(/\s(today|hari ini|tonight)(?=\s)/i)) out.due = addDays(0);
    else if (take(/\s(tomorrow|tmr|tmrw|esok)(?=\s)/i)) out.due = addDays(1);
    else if ((m = take(/\sin\s(\d{1,3})\s(day|days|week|weeks)(?=\s)/i))) out.due = addDays(Number(m[1]) * (/week/i.test(m[2]) ? 7 : 1));
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(next\s)?(sunday|sun|ahad|monday|mon|isnin|tuesday|tues|tue|selasa|wednesday|wed|rabu|thursday|thurs|thur|thu|khamis|friday|fri|jumaat|saturday|sat|sabtu)(?=\s)/i))) {
      const target = DAYS[m[2].toLowerCase()]; let diff = (target - today.getDay() + 7) % 7; if (diff === 0) diff = 7; if (m[1]) diff += 7; out.due = addDays(diff);
    }
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?(?=\s)/))) {
      let y = m[3] ? Number(m[3]) : today.getFullYear(); if (y < 100) y += 2000;
      const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
      if (!m[3] && d < today) d.setFullYear(y + 1);
      if (!isNaN(d)) out.due = iso(d);
    }
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(\d{1,2})\s(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*(?=\s)/i))) {
      const d = new Date(today.getFullYear(), MONTHS[m[2].toLowerCase()], Number(m[1])); if (d < today) d.setFullYear(d.getFullYear() + 1); out.due = iso(d);
    }
    if (/^\s*notes?[:\s]/i.test(t)) { out.kind = 'note'; t = t.replace(/^\s*notes?:?/i, ' '); }
    else if (/\b(quiz|test|exam|midterm|final|assignment|report|project|lab|presentation|essay|proposal|tutorial|homework)\b/i.test(t)) out.kind = 'assignment';

      const prompt = `You help a university student team plan group assignments. Today is ${iso(new Date())} (${new Date().toLocaleDateString('en-GB', { weekday: 'long' })}).
Subjects (id: name):
${subjects}

From the assignment brief${img ? ' (text and/or attached photo)' : ''} below, reply with only a JSON object:
{"title": "short assignment title", "subjectId": "one id from the list above, or null", "due": "YYYY-MM-DD or null", "weight": number or null (percent of grade), "summary": "3-5 sentence plain summary of what must be submitted and how it is marked", "steps": [{"text": "short concrete step", "due": "YYYY-MM-DD or null"}]}
Give 4-10 steps in order. Spread suggested step dates between today and the final due date, finishing a few days early for review. Use null for anything the brief does not say.

Brief:
"""
${text.slice(0, 60000)}
"""`;
      ctrl = new AbortController();
      try {
        const r = await S.sample.json(prompt, { signal: ctrl.signal, images: img ? [img] : undefined, modelTier: 'default' });
        if (!r || typeof r !== 'object') throw { code: 'invalid_json' };
        const okDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : null;
        const sid = subjSel.value || (subjById(r.subjectId) ? r.subjectId : null);
        const steps = Array.isArray(r.steps) ? r.steps.slice(0, 15).filter(s => s && s.text).map(s => ({ id: uid(), text: String(s.text).slice(0, 200), done: false, who: null, due: okDate(s.due) })) : [];
        const bodyText = [r.summary ? '## What we need to do\n' + String(r.summary) : '', text ? '## Original brief\n' + text : ''].filter(Boolean).join('\n\n');
        ctrl = null; closeP();
        openItem(null, { kind: 'assignment', title: String(r.title || 'New assignment').slice(0, 140), subjectId: sid || (subjById(S.sel) ? S.sel : activeSubjects()[0] && activeSubjects()[0].id),
          due: okDate(r.due), weight: Number.isFinite(r.weight) ? Math.round(r.weight) : null, checklist: steps, body: bodyText });
        toast('Check the plan, assign steps to teammates, then Add.');
      } catch (err) {
        go.disabled = false;
        if (err && err.code === 'cancelled') return;
        status.textContent = err && err.code === 'rate_limited' ? 'Too many requests right now. Try again in a minute.'
          : err && (err.code === 'not_granted' || err.code === 'sampling_disabled') ? 'AI help isn’t allowed for you on this page.'
          : err && err.code === 'prompt_too_large' ? 'The brief is too long. Paste only the task and requirements.'
          : 'Couldn’t build a plan from that. Try again, or paste a clearer brief.';
      }
    } },
      h('h3', {}, 'Plan with AI'),
      h('p', { text: 'Paste the assignment brief. AI writes a summary, finds the due date and weight, and splits the work into steps with suggested dates. You review everything before it’s added.' }),
      h('label', { class: 'f' }, h('span', { text: 'Subject' }), subjSel),
      h('label', { class: 'f' }, h('span', { text: 'Assignment brief' }), brief),
      photo ? h('label', { class: 'f' }, h('span', { text: 'Or a photo of the brief (optional)' }), photo) : null,
      status,
      h('div', { style: 'display:flex;gap:8px;justify-content:flex-end' }, h('button', { class: 'btn', type: 'button', onclick: () => closeP(), text: 'Cancel' }), go));
    const closeP = showLayer(form, { center: true, onClose: () => { if (ctrl) ctrl.abort(); } });
    brief.focus();
  }

  // ---------- subject editor ----------
  function openSubject(s) {
    let color = Number.isInteger(s.color) ? s.color : 7;
    const name = h('input', { class: 'field', id: 'sub-name', value: s.name || '', maxlength: '60' });
    const code = h('input', { class: 'field', id: 'sub-code', value: s.code || '', maxlength: '12' });
    const sw = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
    const drawSw = () => sw.replaceChildren(...[0, 1, 2, 3, 4, 5, 6, 7].map(c => h('button', { type: 'button', style: `--c:var(--s${c})`, 'aria-pressed': String(c === color), 'aria-label': `Colour ${c + 1}`, onclick: () => { color = c; drawSw(); } })));
    drawSw();
    const n = S.items.filter(i => i.subjectId === s.id).length;
    const confirmBox = h('div');
    const form = h('form', { class: 'modal', onsubmit: async e => {
      e.preventDefault();
      const nm = name.value.trim(); if (!nm) { name.focus(); return; }
      try { await S.db.doc('subjects/' + s.id).update({ name: nm, code: code.value.trim().toUpperCase(), color }); closeS(); toast('Subject updated'); }
      catch (err) { writeErr(err); }
    } },
      h('h3', { text: 'Edit subject' }),
      h('div', { class: 'frow' }, h('label', { class: 'f' }, h('span', { text: 'Name' }), name), h('label', { class: 'f' }, h('span', { text: 'Code' }), code)),
      h('div', { class: 'f' }, h('span', { text: 'Colour' }), sw),
      h('div', { class: 'f' }, h('span', { text: s.archived ? 'This subject is archived' : 'Finished this semester?' }),
        h('div', {}, h('button', { class: 'btn', type: 'button', onclick: async () => {
          try { await S.db.doc('subjects/' + s.id).update({ archived: !s.archived }); closeS(); if (!s.archived) { S.sel = 'all'; savePrefs(); } toast(s.archived ? 'Subject restored' : 'Subject archived. Find it under Show archived.'); render(); }
          catch (err) { writeErr(err); }
        }, text: s.archived ? 'Restore subject' : 'Archive subject' }))),
      confirmBox,
      h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' },
        h('button', { class: 'btn danger', type: 'button', onclick: () => {
          confirmBox.replaceChildren(h('div', { class: 'confirm' }, h('span', { text: `Delete ${s.name}${n ? ` and its ${n} item${n === 1 ? '' : 's'}` : ''} for everyone? This can’t be undone. Archiving keeps it instead.` }),
            h('button', { class: 'btn danger solid', type: 'button', onclick: async ev => {
              ev.currentTarget.disabled = true;
              try {
                for (const i of S.items.filter(i => i.subjectId === s.id)) await deleteItem(i);
                await S.db.doc('subjects/' + s.id).delete();
                S.sel = 'all'; savePrefs(); closeS(); toast(`Deleted ${s.name}`); render();
              } catch (err) { writeErr(err); }
            }, text: 'Delete' })));
        }, text: 'Delete subject' }),
        h('span', { style: 'flex:1' }),
        h('button', { class: 'btn', type: 'button', onclick: () => closeS(), text: 'Cancel' }),
        h('button', { class: 'btn primary', type: 'submit', text: 'Save' })));
    const closeS = showLayer(form, { center: true });
    name.focus();
  }

  // ---------- export ----------
  async function exportScope(subj, scope) {
    const items = sortItems(scope.slice());
    const title = subj ? `${subj.name}${subj.code ? ' (' + subj.code + ')' : ''}` : S.sel === 'mine' ? 'My tasks' : 'All subjects';
    const L = [`# ${title}`, `Exported from Team Notebook on ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}`, ''];
    for (const it of items) {
      const s = subjById(it.subjectId);
      L.push(`## ${KINDS[it.kind] || 'Note'}: ${it.title || 'Untitled'}`);
      const meta = [!subj && s ? `Subject: ${s.code || s.name}` : '', `Status: ${STATUS_LABEL[it.status] || 'To do'}`, it.due ? `Due: ${fmtDate(it.due, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })}` : '', it.weight ? `Weight: ${it.weight}%` : ''].filter(Boolean);
      L.push(meta.join(' · '), '');
      if ((it.checklist || []).length) { L.push('**Checklist**'); for (const c of it.checklist) L.push(`- [${c.done ? 'x' : ' '}] ${c.text}${c.due ? ' (by ' + fmtDate(c.due, { day: 'numeric', month: 'short' }) + ')' : ''}`); L.push(''); }
      if (it.body) L.push(it.body.trim(), '');
      if ((it.files || []).length) L.push('Files: ' + it.files.map(f => f.name).join(', '), '');
    }
    const fname = (subj ? (subj.code || subj.name) : S.sel === 'mine' ? 'my-tasks' : 'all-subjects').replace(/[^\w-]+/g, '-') + '-notes.md';
    try { await S.downloads.save({ filename: fname, data: L.join('\n') }); toast('Exported'); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && ['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { S.downloads = null; renderMain(); toast('Export isn’t available here.'); return; }
      toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Export didn’t work. Try again.');
    }
  }

  // ---------- boot ----------
  function render() { renderSide(); renderMain(); }
  phoneMQ.addEventListener('change', () => { if (!isPhone()) { S.searchOpen = false; document.body.classList.remove('searching'); } render(); });

  async function boot() {
    applyTheme();
    render();
    const [db, user, assets, room, sample, downloads] = await Promise.all(['db', 'user', 'assets', 'room', 'sample', 'downloads'].map(n => use(n).catch(() => null)));
    Object.assign(S, { user, assets, sample, downloads });
    if (!db) { S.unavailable = true; render(); return; }
    S.db = db;
    if (user) {
      const [me, can] = await Promise.all([user.me(), user.can('data.write')]);
      S.meId = me.id; S.canWrite = can;
      $('me').replaceChildren(h('img', { src: me.avatarUrl, alt: me.name || 'You', title: me.name || 'You' }));
    }
    if (room) {
      S.room = room;
      room.onPeers(ch => { S.peers = ch.peers; renderOnline(); if (S.itemsReady) renderMain(); if (drawerHere) drawerHere(); }, () => {});
      setPresence(S.openItemId);
    }
    const onErr = e => { if (e && e.code === 'revoked') { S.unavailable = true; render(); } else toast('Lost connection to the notebook. Reload the page to reconnect.'); };
    db.collection('subjects').onSnapshot(snap => {
      S.subjects = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      S.subjReady = true; render();
    }, onErr);
    db.collection('items').onSnapshot(snap => {
      S.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.itemsReady = true; render();
    }, onErr);
  }
  boot();
})();
</script>
