<title>Team Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: subject binder tabs on the left; on the right a quick-add bar, the next-deadline countdown, then the subject's work as a list, a status board or a month calendar. Item details open in a side drawer. Stacks on phones. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --ink: #172033; --muted: #5a6377; --line: #d8dde8;
  --accent: #3446c4; --accent-ink: #ffffff; --hl: rgba(242, 207, 54, .55); --late: #c0362c; --ok: #2b8656;
  --scrim: rgba(10, 14, 24, .45); --shadow: rgba(16, 24, 40, .18);
  --s0: #3446c4; --s1: #c0362c; --s2: #2b8656; --s3: #b26a00; --s4: #8a3fb8; --s5: #0f7c8c; --s6: #c2417f; --s7: #55607a;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131b; --surface: #171c27; --surface-2: #1d2331; --ink: #e6e9f1; --muted: #99a2b5; --line: #2a3142;
  --accent: #8d9bff; --accent-ink: #0f131b; --hl: rgba(232, 200, 62, .32); --late: #ff7d70; --ok: #5ccb8f;
  --scrim: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
  --s0: #8d9bff; --s1: #ff7d70; --s2: #5ccb8f; --s3: #f0a640; --s4: #c48bf0; --s5: #4fc7d6; --s6: #f07db3; --s7: #a3abc0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171c27; --surface-2: #1d2331; --ink: #e6e9f1; --muted: #99a2b5; --line: #2a3142;
  --accent: #8d9bff; --accent-ink: #0f131b; --hl: rgba(232, 200, 62, .32); --late: #ff7d70; --ok: #5ccb8f;
  --scrim: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .5);
  --s0: #8d9bff; --s1: #ff7d70; --s2: #5ccb8f; --s3: #f0a640; --s4: #c48bf0; --s5: #4fc7d6; --s6: #f07db3; --s7: #a3abc0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 56px; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { font: 800 26px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; }
.brand small { display: block; font: 500 11.5px/1.4 var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
.topr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.search { display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); width: min(300px, 100%); }
.search input { border: 0; background: none; padding: 8px 0; min-width: 0; flex: 1; color: var(--ink); outline: none; }
.search:focus-within { border-color: var(--accent); }
.online { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.online .ppl img { width: 26px; height: 26px; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.me { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.me img { width: 28px; height: 28px; border-radius: 50%; }

/* Quick add */
.quick { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 16px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.quick input { border: 0; background: none; padding: 6px 8px; min-width: 0; outline: none; font-size: 15px; }
.qprev { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px 2px; font-size: 12.5px; }
.qprev:empty { display: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.pill b { color: var(--ink); font-weight: 600; }
.pill i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

.grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }

/* Subject tabs */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 12px; }
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tabs { display: grid; gap: 2px; }
.tab { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; }
.tab:hover { background: var(--surface-2); }
.tab[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.tab.arch { opacity: .65; }
.tab .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--ink)); }
.tab .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.tab .code { font: 500 11px var(--f-mono); color: var(--muted); margin-left: 6px; }
.tab .n { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab .bar { grid-column: 2 / -1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.tab .bar span { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 4px; }
.tab .icon-dot { display: grid; place-items: center; width: 10px; color: var(--accent); }
.linkbtn { border: 0; background: none; padding: 4px 10px; color: var(--muted); font-size: 13px; text-align: left; }
.linkbtn:hover { color: var(--ink); }
.addsub { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r); }
.addsub-toggle { display: none; }
.addsub .row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 6px; }
.field { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.field::placeholder { color: var(--muted); opacity: .8; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--late); }
.btn.danger.solid { background: var(--late); color: var(--surface); border-color: var(--late); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* Main */
.main { min-width: 0; display: grid; gap: 14px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: center; padding: 16px 20px; border-radius: 14px; background: var(--ink); color: var(--bg); }
.hero .label { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.hero h3 { margin: 6px 0 4px; font: 600 19px/1.25 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.hero h3 button { all: unset; cursor: pointer; }
.hero h3 button:hover { text-decoration: underline; }
.hero .sub { font: 500 12.5px var(--f-mono); color: color-mix(in srgb, var(--bg) 70%, var(--ink)); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.count { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.count div { display: grid; justify-items: center; }
.count b { font: 800 clamp(30px, 5vw, 42px)/1 var(--f-display); letter-spacing: -.02em; }
.count small { font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.hero.late { background: var(--late); }

.head { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 14px; border-top: 5px solid var(--c, var(--accent)); }
.head h2 { margin: 0; font: 800 clamp(24px, 4vw, 34px)/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.head .code { font: 500 13px var(--f-mono); color: var(--muted); }
.head-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat { display: grid; gap: 2px; }
.stat b { font: 600 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat.late b { color: var(--late); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .sp { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shadow), 0 0 0 1px var(--line); }
.tools-l { display: flex; flex-wrap: wrap; gap: 8px; }

/* Cards */
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card.done { background: var(--surface-2); }
.card.done .ttl { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .4; }
.status { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 1px; flex: none; }
.status[data-s="doing"] { border-color: var(--accent); background: conic-gradient(var(--accent) 0 50%, transparent 50% 100%); }
.status[data-s="done"] { border-color: var(--ok); background: var(--ok); }
.status[data-s="done"]::after { content: ""; width: 10px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.status:disabled { cursor: default; }
.body { min-width: 0; display: grid; gap: 6px; }
.line1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.ttl { font-weight: 600; font-size: 16px; border: 0; background: none; padding: 0; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.ttl:hover { color: var(--accent); }
.kind { font: 500 10.5px/1 var(--f-mono); letter-spacing: .07em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.kind.assignment { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.here { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ok); }
.here img { width: 16px; height: 16px; border-radius: 50%; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.due { font: 500 12.5px var(--f-mono); font-variant-numeric: tabular-nums; }
.due.soon { color: var(--ink); background: linear-gradient(transparent 45%, var(--hl) 45%, var(--hl) 92%, transparent 92%); padding-inline: 2px; }
.due.late { color: var(--late); }
.subj i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.ppl { display: inline-flex; align-items: center; }
.ppl img { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; background: var(--surface-2); }
.ppl img:first-child { margin-left: 0; }
.prog { height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--ok); border-radius: 5px; }
.note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more { justify-self: start; border: 0; background: none; padding: 0; font-size: 13px; color: var(--accent); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.cl { display: grid; gap: 2px; padding: 6px 0 0; }
.cl label { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 14px; padding: 3px 0; }
.cl input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ok); }
.cl .done-t { color: var(--muted); text-decoration: line-through; }
.cl .who { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.cl .who img { width: 18px; height: 18px; border-radius: 50%; }

/* Board */
.board { display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 160px; }
.col.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); }
.col h4 { margin: 0; display: flex; justify-content: space-between; font: 600 14px var(--f-display); padding: 2px 4px; }
.col h4 span { font: 500 12px var(--f-mono); color: var(--muted); }
.col .card { padding: 12px; gap: 10px; }
.col .ttl { font-size: 15px; }

/* Calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cal-h h3 { margin: 0; font: 600 18px var(--f-display); }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-g .dow { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 2px 4px; }
.day { min-height: 92px; border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: grid; align-content: start; gap: 3px; background: var(--surface); text-align: left; min-width: 0; }
.day.out { background: var(--surface-2); opacity: .6; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.sel { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.day .num { font: 500 12px var(--f-mono); color: var(--muted); border: 0; background: none; padding: 1px 3px; text-align: left; border-radius: 4px; }
.day.today .num { color: var(--accent); font-weight: 700; }
.ev { display: block; width: 100%; border: 0; border-left: 3px solid var(--c); background: var(--surface-2); border-radius: 3px; padding: 2px 5px; font-size: 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.done { text-decoration: line-through; color: var(--muted); }
.ev:hover { background: var(--line); }
.ev-more { font-size: 11.5px; color: var(--muted); padding-left: 4px; }

.empty { text-align: center; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { margin: 0; color: var(--ink); font: 600 20px var(--f-display); }
.empty p { margin: 0; max-width: 50ch; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }

/* Drawer + modal */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; justify-content: flex-end; }
.overlay.center { justify-content: center; align-items: center; padding: 16px; overflow-y: auto; }
.drawer { width: min(640px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: -10px 0 40px var(--shadow); }
.drawer-h { padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.drawer-h h3 { margin: 0; font: 800 20px var(--f-display); }
.drawer-b { overflow-y: auto; padding: 18px 20px; display: grid; gap: 16px; align-content: start; }
.drawer-f { padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 12px); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.drawer-f .r { display: flex; gap: 8px; margin-left: auto; }
.modal { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 60px var(--shadow); }
.modal h3 { margin: 0; font: 800 22px var(--f-display); }
.modal p { margin: 0; color: var(--muted); font-size: 14px; }
.f { display: grid; gap: 5px; }
.f > span, .sec-h { font-size: 13px; font-weight: 600; color: var(--muted); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
textarea.field { min-height: 150px; resize: vertical; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 3px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.chip img { width: 20px; height: 20px; border-radius: 50%; }
.chip button { border: 0; background: none; padding: 0 6px; color: var(--muted); font-size: 15px; line-height: 1; }
.picker { position: relative; flex: 1; min-width: 0; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; z-index: 2; box-shadow: 0 8px 24px var(--shadow); display: grid; }
.results button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 8px; border-radius: 6px; text-align: left; }
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results img { width: 22px; height: 22px; border-radius: 50%; }
.by { font-size: 12.5px; color: var(--muted); }
.alsohere { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 12%, var(--surface)); font-size: 13px; }
.alsohere img { width: 20px; height: 20px; border-radius: 50%; }

.cl-ed { display: grid; gap: 6px; }
.cl-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 120px 128px 28px; gap: 6px; align-items: center; }
.cl-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ok); margin: 0; }
.cl-row .field { padding: 6px 8px; font-size: 14px; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; border-radius: 6px; }
.x:hover { color: var(--late); background: var(--surface-2); }

.files { display: grid; gap: 6px; }
.file { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.file a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file small { font: 500 11.5px var(--f-mono); color: var(--muted); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.thumbs a { display: block; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); max-width: 100%; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.drop { display: grid; place-items: center; gap: 4px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; cursor: pointer; }
.drop.over { border-color: var(--accent); color: var(--accent); }

.md { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }

.md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }

.md-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 150px; background: var(--surface); }
.ai-box { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }

.comments { display: grid; gap: 10px; }
.cm { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }

@media (max-width: 760px) {

  .cl-row .cl-x { grid-column: 3; grid-row: 1; }
  .drawer-b, .drawer-h, .drawer-f { padding-inline: 16px; }

<script>
(() => {
  const KINDS = { assignment: 'Assignment', task: 'Task', note: 'Note' };
  const STATUS = ['todo', 'doing', 'done'];
  const STATUS_LABEL = { todo: 'To do', doing: 'In progress', done: 'Done' };
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);

  const S = {
    db: null, user: null, assets: null, room: null, sample: null, downloads: null,
    meId: null, canWrite: null, readOnly: false, unavailable: false,
    subjects: [], items: [], subjReady: false, itemsReady: false, peers: [],
    sel: 'all', kind: 'all', show: 'open', view: 'list', q: '', showArchived: false,
    calMonth: null, calDay: null, expanded: new Set(), theme: 'system', openItemId: null,
  };
  try {
    const p = JSON.parse(localStorage.getItem('tn-prefs') || '{}');
    for (const k of ['sel', 'kind', 'show', 'view', 'theme']) if (p[k]) S[k] = p[k];
  } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem('tn-prefs', JSON.stringify({ sel: S.sel, kind: S.kind, show: S.show, view: S.view, theme: S.theme })); } catch (e) {} };

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const ICONS = {
    clip: '<path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/>',
    list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    board: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
    down: '<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
    check: '<path d="M4 12l5 5L20 6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  };
  const icon = n => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i'); s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = ICONS[n]; return s; };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseISO = s => { const [y, m, d] = String(s || '').split('-').map(Number); return y && m && d ? new Date(y, m - 1, d) : null; };
  const fmtDate = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => { const d = parseISO(s); return d ? d.toLocaleDateString(undefined, o) : ''; };
  const startOfToday = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const clone = o => JSON.parse(JSON.stringify(o));

  let toastT;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3400); }
  function writeErr(e) {
    const code = e && e.code;
    if (code === 'invalid_argument') { S.readOnly = true; render(); toast('You can view this board but not edit it. Ask the owner for Contributor access.'); }
    else if (code === 'quota_exceeded') toast('The notebook is full. Delete some old items, then try again.');
    else if (code === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
    else toast('That change did not save. Check your connection and try again.');
  }
  const canEdit = () => !!S.db && !S.readOnly && S.canWrite !== false;

  // Minimal, escaped markdown: headings, bold, italic, code, links, lists, quotes.
  function md(src) {
    const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inline = s => {
      s = esc(s);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
      return s;
    };
    const out = []; let list = null, para = [];
    const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
    for (const raw of String(src || '').split('\n')) {
      const line = raw.replace(/\s+$/, '');
      let m;
      if (!line.trim()) { flushP(); flushL(); continue; }
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushP(); flushL(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^>\s?(.*)$/))) { flushP(); flushL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
      flushL(); para.push(line);
    }
    flushP(); flushL();
    return out.join('');
  }
  const plain = s => String(s || '').replace(/^#+\s*/gm, '').replace(/\*\*|`|^>\s?/gm, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\s+/g, ' ').trim();

  // ---------- data helpers ----------
  const subjById = id => S.subjects.find(s => s.id === id);
  const subjColor = s => `var(--s${(s && Number.isInteger(s.color) ? s.color : 7) % 8})`;
  const activeSubjects = () => S.subjects.filter(s => !s.archived);
  const isArchivedSubj = id => { const s = subjById(id); return !s || !!s.archived; };
  const isMine = i => !!S.meId && ((i.assignees || []).includes(S.meId) || (i.checklist || []).some(c => c.who === S.meId));
  function inScope(i) {
    if (S.sel === 'mine') return isMine(i) && !isArchivedSubj(i.subjectId);
    if (S.sel === 'all') return !isArchivedSubj(i.subjectId);
    return i.subjectId === S.sel;
  }
  function matchesQuery(i, q) {
    const s = subjById(i.subjectId);
    const hay = [i.title, i.body, s && s.name, s && s.code, ...(i.checklist || []).map(c => c.text), ...(i.files || []).map(f => f.name)].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
  }
  function dueInfo(due, done) {
    const t = parseISO(due); if (!t) return null;
    const days = Math.round((t - startOfToday()) / 86400000);
    const dateStr = t.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    if (done) return { days, label: dateStr, tone: '' };
    if (days < 0) return { days, label: `${-days} day${days === -1 ? '' : 's'} overdue`, tone: 'late' };
    if (days === 0) return { days, label: 'Due today', tone: 'soon' };
    if (days === 1) return { days, label: 'Due tomorrow', tone: 'soon' };
    if (days <= 7) return { days, label: `Due in ${days} days · ${dateStr}`, tone: 'soon' };
    return { days, label: `Due ${dateStr}`, tone: '' };
  }
  function sortItems(list) {
    return list.sort((a, b) => {
      const ad = a.status === 'done', bd = b.status === 'done';
      if (ad !== bd) return ad ? 1 : -1;
      if (ad) return (b.updatedAt || '').localeCompare(a.updatedAt || '');
      if (!!a.due !== !!b.due) return a.due ? -1 : 1;
      if (a.due && b.due && a.due !== b.due) return a.due.localeCompare(b.due);
      return (b.updatedAt || '').localeCompare(a.updatedAt || '');
    });
  }

  async function fillPeople(root) {
    if (!S.user) return;
    const els = [...root.querySelectorAll('[data-uid]')];
    const ids = [...new Set(els.map(e => e.dataset.uid).filter(Boolean))];
    if (!ids.length) return;
    const ps = await S.user.profiles(ids);
    for (const e of els) {
      const p = ps[e.dataset.uid]; if (!p) continue;
      const nm = p.isMe ? 'You' : (p.name || 'Teammate');
      if (e.tagName === 'IMG') { e.src = p.avatarUrl; e.alt = nm; e.title = nm; }
      else e.textContent = e.dataset.suffix ? nm + e.dataset.suffix : nm;
    }
  }

  async function setStatus(it, status) {
    try { await S.db.doc('items/' + it.id).update({ status, updatedAt: new Date().toISOString() }); }
    catch (e) { writeErr(e); }
  }
  async function toggleCheck(it, cid) {
    const cl = clone(it.checklist || []);
    const c = cl.find(x => x.id === cid); if (!c) return;
    c.done = !c.done;
    try { await S.db.doc('items/' + it.id).update({ checklist: cl, updatedAt: new Date().toISOString() }); }
    catch (e) { writeErr(e); }
  }
  async function deleteItem(it) {
    try {
      const cs = await S.db.collection('items/' + it.id + '/comments').get();
      for (const d of cs.docs) await S.db.doc('items/' + it.id + '/comments/' + d.id).delete();
    } catch (e) {}
    await S.db.doc('items/' + it.id).delete();
    if (S.assets) for (const f of it.files || []) { try { await S.assets.delete(f.id); } catch (e) {} }
  }

  // ---------- presence ----------
  const peerUid = p => p.by || (p.presence && typeof p.presence.uid === 'string' ? p.presence.uid : null);
  function viewersOf(itemId) {
    const ids = new Set();
    for (const p of S.peers) if (!p.isMe && p.kind === 'viewer' && p.presence && p.presence.item === itemId) { const u = peerUid(p); if (u) ids.add(u); }
    return [...ids];
  }
  function setPresence(itemId) {
    S.openItemId = itemId;
    if (S.room) S.room.presence({ uid: S.meId, item: itemId || null }).catch(() => {});
  }
  function renderOnline() {
    const box = $('online'); box.replaceChildren();
    if (!S.room) return;
    const ids = [...new Set(S.peers.filter(p => p.kind === 'viewer').map(peerUid).filter(Boolean))];
    if (!ids.length) return;
    box.append(h('span', { class: 'live', title: 'Live' }), h('span', { class: 'ppl' }, ids.slice(0, 6).map(u => h('img', { 'data-uid': u, alt: '' }))),
      h('span', { text: ids.length === 1 ? 'Only you online' : `${ids.length} online` }));
    fillPeople(box);
  }

  // ---------- theme ----------
  function applyTheme() {
    const r = document.documentElement;
    if (S.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
    const b = $('theme');
    b.replaceChildren(icon(S.theme === 'dark' ? 'moon' : S.theme === 'light' ? 'sun' : 'auto'), { system: 'Auto', light: 'Light', dark: 'Dark' }[S.theme]);
    b.setAttribute('aria-label', `Theme: ${S.theme}. Change theme`);
  }
  $('theme').addEventListener('click', () => { S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme] || 'system'; savePrefs(); applyTheme(); });

  // ---------- search ----------
  $('search').addEventListener('input', e => { S.q = e.target.value.trim(); renderMain(); });

  // ---------- quick add ----------
  const DAYS = { sun: 0, sunday: 0, ahad: 0, mon: 1, monday: 1, isnin: 1, tue: 2, tues: 2, tuesday: 2, selasa: 2, wed: 3, wednesday: 3, rabu: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, khamis: 4, fri: 5, friday: 5, jumaat: 5, sat: 6, saturday: 6, sabtu: 6 };
  const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, sept: 8, oct: 9, nov: 10, dec: 11 };
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function parseQuick(text) {
    let t = ' ' + text + ' ';
    const out = { kind: 'task', subjectId: null, due: null, me: false, title: '' };
    const take = re => { const m = t.match(re); if (m) t = t.replace(re, ' '); return m; };
    const keys = [];
    for (const s of activeSubjects()) { if (s.code) keys.push([s.code, s.id]); if (s.name) keys.push([s.name, s.id]); }
    keys.sort((a, b) => b[0].length - a[0].length);
    for (const [k, id] of keys) { if (take(new RegExp('\\s' + escRe(k) + '(?=\\s)', 'i'))) { out.subjectId = id; break; } }
    if (take(/\s@me(?=\s)/i)) out.me = true;
    const today = startOfToday();
    const addDays = n => { const d = new Date(today); d.setDate(d.getDate() + n); return iso(d); };
    let m;
    if (take(/\s(today|hari ini|tonight)(?=\s)/i)) out.due = addDays(0);
    else if (take(/\s(tomorrow|tmr|tmrw|esok)(?=\s)/i)) out.due = addDays(1);
    else if ((m = take(/\sin\s(\d{1,3})\s(day|days|week|weeks)(?=\s)/i))) out.due = addDays(Number(m[1]) * (/week/i.test(m[2]) ? 7 : 1));
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(next\s)?(sunday|sun|ahad|monday|mon|isnin|tuesday|tues|tue|selasa|wednesday|wed|rabu|thursday|thurs|thur|thu|khamis|friday|fri|jumaat|saturday|sat|sabtu)(?=\s)/i))) {
      const target = DAYS[m[2].toLowerCase()]; let diff = (target - today.getDay() + 7) % 7; if (diff === 0) diff = 7; if (m[1]) diff += 7; out.due = addDays(diff);
    }
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?(?=\s)/))) {
      let y = m[3] ? Number(m[3]) : today.getFullYear(); if (y < 100) y += 2000;
      const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
      if (!m[3] && d < today) d.setFullYear(y + 1);
      if (!isNaN(d)) out.due = iso(d);
    }
    else if ((m = take(/\s(?:on\s|by\s|due\s)?(\d{1,2})\s(jan|feb|mar|apr|may|jun|jul|aug|sept|sep|oct|nov|dec)[a-z]*(?=\s)/i))) {
      const d = new Date(today.getFullYear(), MONTHS[m[2].toLowerCase()], Number(m[1])); if (d < today) d.setFullYear(d.getFullYear() + 1); out.due = iso(d);
    }
    if (/^\s*notes?[:\s]/i.test(t)) { out.kind = 'note'; t = t.replace(/^\s*notes?:?/i, ' '); }
    else if (/\b(quiz|test|exam|midterm|final|assignment|report|project|lab|presentation|essay|proposal|tutorial|homework)\b/i.test(t)) out.kind = 'assignment';
    out.title = t.replace(/\s+/g, ' ').trim();
    if (!out.subjectId) out.subjectId = (S.sel !== 'all' && S.sel !== 'mine' && subjById(S.sel)) ? S.sel : (activeSubjects()[0] && activeSubjects()[0].id);
    return out;
  }
  const qIn = $('quick-in');
  function drawQuickPreview() {
    const box = $('quick-prev'); box.replaceChildren();
    if (!qIn.value.trim()) return;
    const p = parseQuick(qIn.value); const s = subjById(p.subjectId);

      h('label', { class: 'f' }, h('span', { text: 'Subject' }), subjSel),
      h('label', { class: 'f' }, h('span', { text: 'Assignment brief' }), brief),
      photo ? h('label', { class: 'f' }, h('span', { text: 'Or a photo of the brief (optional)' }), photo) : null,
      status,
      h('div', { style: 'display:flex;gap:8px;justify-content:flex-end' }, h('button', { class: 'btn', type: 'button', onclick: () => closeP(), text: 'Cancel' }), go));
    const closeP = showLayer(form, { center: true, onClose: () => { if (ctrl) ctrl.abort(); } });
    brief.focus();
  }

  // ---------- subject editor ----------
  function openSubject(s) {
    let color = Number.isInteger(s.color) ? s.color : 7;
    const name = h('input', { class: 'field', id: 'sub-name', value: s.name || '', maxlength: '60' });
    const code = h('input', { class: 'field', id: 'sub-code', value: s.code || '', maxlength: '12' });
    const sw = h('div', { class: 'swatches', role: 'group', 'aria-label': 'Colour' });
    const drawSw = () => sw.replaceChildren(...[0, 1, 2, 3, 4, 5, 6, 7].map(c => h('button', { type: 'button', style: `--c:var(--s${c})`, 'aria-pressed': String(c === color), 'aria-label': `Colour ${c + 1}`, onclick: () => { color = c; drawSw(); } })));
    drawSw();
    const n = S.items.filter(i => i.subjectId === s.id).length;
    const confirmBox = h('div');
    const form = h('form', { class: 'modal', onsubmit: async e => {
      e.preventDefault();
      const nm = name.value.trim(); if (!nm) { name.focus(); return; }
      try { await S.db.doc('subjects/' + s.id).update({ name: nm, code: code.value.trim().toUpperCase(), color }); closeS(); toast('Subject updated'); }
      catch (err) { writeErr(err); }
    } },
      h('h3', { text: 'Edit subject' }),
      h('div', { class: 'frow' }, h('label', { class: 'f' }, h('span', { text: 'Name' }), name), h('label', { class: 'f' }, h('span', { text: 'Code' }), code)),
      h('div', { class: 'f' }, h('span', { text: 'Colour' }), sw),
      h('div', { class: 'f' }, h('span', { text: s.archived ? 'This subject is archived' : 'Finished this semester?' }),
        h('div', {}, h('button', { class: 'btn', type: 'button', onclick: async () => {
          try { await S.db.doc('subjects/' + s.id).update({ archived: !s.archived }); closeS(); if (!s.archived) { S.sel = 'all'; savePrefs(); } toast(s.archived ? 'Subject restored' : 'Subject archived. Find it under Show archived.'); render(); }
          catch (err) { writeErr(err); }
        }, text: s.archived ? 'Restore subject' : 'Archive subject' }))),
      confirmBox,
      h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center' },
        h('button', { class: 'btn danger', type: 'button', onclick: () => {
          confirmBox.replaceChildren(h('div', { class: 'confirm' }, h('span', { text: `Delete ${s.name}${n ? ` and its ${n} item${n === 1 ? '' : 's'}` : ''} for everyone? This can’t be undone. Archiving keeps it instead.` }),
            h('button', { class: 'btn danger solid', type: 'button', onclick: async ev => {
              ev.currentTarget.disabled = true;
              try {
                for (const i of S.items.filter(i => i.subjectId === s.id)) await deleteItem(i);
                await S.db.doc('subjects/' + s.id).delete();
                S.sel = 'all'; savePrefs(); closeS(); toast(`Deleted ${s.name}`); render();
              } catch (err) { writeErr(err); }
            }, text: 'Delete' })));
        }, text: 'Delete subject' }),
        h('span', { style: 'flex:1' }),
        h('button', { class: 'btn', type: 'button', onclick: () => closeS(), text: 'Cancel' }),
        h('button', { class: 'btn primary', type: 'submit', text: 'Save' })));
    const closeS = showLayer(form, { center: true });
    name.focus();
  }

  // ---------- export ----------
  async function exportScope(subj, scope) {
    const items = sortItems(scope.slice());
    const title = subj ? `${subj.name}${subj.code ? ' (' + subj.code + ')' : ''}` : S.sel === 'mine' ? 'My tasks' : 'All subjects';
    const L = [`# ${title}`, `Exported from Team Notebook on ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}`, ''];
    for (const it of items) {
      const s = subjById(it.subjectId);
      L.push(`## ${KINDS[it.kind] || 'Note'}: ${it.title || 'Untitled'}`);
      const meta = [!subj && s ? `Subject: ${s.code || s.name}` : '', `Status: ${STATUS_LABEL[it.status] || 'To do'}`, it.due ? `Due: ${fmtDate(it.due, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })}` : '', it.weight ? `Weight: ${it.weight}%` : ''].filter(Boolean);
      L.push(meta.join(' · '), '');
      if ((it.checklist || []).length) { L.push('**Checklist**'); for (const c of it.checklist) L.push(`- [${c.done ? 'x' : ' '}] ${c.text}${c.due ? ' (by ' + fmtDate(c.due, { day: 'numeric', month: 'short' }) + ')' : ''}`); L.push(''); }
      if (it.body) L.push(it.body.trim(), '');
      if ((it.files || []).length) L.push('Files: ' + it.files.map(f => f.name).join(', '), '');
    }
    const fname = (subj ? (subj.code || subj.name) : S.sel === 'mine' ? 'my-tasks' : 'all-subjects').replace(/[^\w-]+/g, '-') + '-notes.md';
    try { await S.downloads.save({ filename: fname, data: L.join('\n') }); toast('Exported'); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && ['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { S.downloads = null; renderMain(); toast('Export isn’t available here.'); return; }
      toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'Export didn’t work. Try again.');
    }
  }

  // ---------- boot ----------
  function render() { renderSide(); renderMain(); }

  async function boot() {
    applyTheme();
    render();
    const [db, user, assets, room, sample, downloads] = await Promise.all(['db', 'user', 'assets', 'room', 'sample', 'downloads'].map(n => use(n).catch(() => null)));
    Object.assign(S, { user, assets, sample, downloads });
    if (!db) { S.unavailable = true; render(); return; }
    S.db = db;
    if (user) {
      const [me, can] = await Promise.all([user.me(), user.can('data.write')]);
      S.meId = me.id; S.canWrite = can;
      $('me').replaceChildren(h('img', { src: me.avatarUrl, alt: '' }), h('span', { text: me.name || 'You' }));
    }
    if (room) {
      S.room = room;
      room.onPeers(ch => { S.peers = ch.peers; renderOnline(); if (S.itemsReady) renderMain(); if (drawerHere) drawerHere(); }, () => {});
      setPresence(S.openItemId);
    }
    const onErr = e => { if (e && e.code === 'revoked') { S.unavailable = true; render(); } else toast('Lost connection to the notebook. Reload the page to reconnect.'); };
    db.collection('subjects').onSnapshot(snap => {
      S.subjects = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
      S.subjReady = true; render();
    }, onErr);
    db.collection('items').onSnapshot(snap => {
      S.items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.itemsReady = true; render();
    }, onErr);
  }
  boot();
})();
</script>
